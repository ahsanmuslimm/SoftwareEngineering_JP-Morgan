name: Midas Core CI/CD Pipeline

# Trigger: Run on push to any branch and pull requests
on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: Build & Test
  build-and-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: ['17']  # Test with Java 17 (as per pom.xml)
    
    steps:
      # Step 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Set up Java environment
      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
      
      # Step 3: Display Java version for verification
      - name: Display Java version
        run: java -version
      
      # Step 4: Clean and build project (compile + unit tests)
      - name: Build with Maven
        run: mvn clean install -DskipTests
      
      # Step 5: Run all tests (unit + integration)
      - name: Run tests
        run: mvn test
      
      # Step 6: Generate code coverage report
      - name: Generate coverage report
        run: mvn jacoco:report || true  # Allow failure if JaCoCo not configured
      
      # Step 7: Upload test results (for PR comments)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.java-version }}
          path: target/surefire-reports/

  # Job 2: Build Docker image
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test  # Wait for tests to pass before building Docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Only for main branch
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Set up Java (needed to build the JAR for Docker)
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      # Step 3: Build the JAR
      - name: Build JAR
        run: mvn clean package -DskipTests
      
      # Step 4: Set up Docker Buildx (for advanced features)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      # Step 5: Build Docker image (local only - push to registry optional)
      - name: Build Docker image
        run: |
          docker build -t midas-core:${{ github.sha }} .
          docker build -t midas-core:latest .
          docker images
      
      # Step 6: Run Docker container for verification
      - name: Start Docker container
        run: |
          docker run -d \
            --name midas-core-test \
            -p 33400:33400 \
            -e SPRING_DATASOURCE_URL=jdbc:h2:mem:testdb \
            midas-core:latest
          sleep 5
      
      # Step 7: Health check - verify container is running
      - name: Health check
        run: |
          curl -v http://localhost:33400/actuator/health || exit 1
      
      # Step 8: Cleanup container
      - name: Cleanup container
        if: always()
        run: docker stop midas-core-test && docker rm midas-core-test

  # Job 3: Code quality checks (optional)
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      # Optional: Run linting, checkstyle, SpotBugs, etc.
      # Uncomment if project has these tools configured
      # - name: Run CheckStyle
      #   run: mvn checkstyle:check

# ─────────────────────────────────────────────────────────────────────────
# CI/CD Pipeline Summary:
# 1. On every push/PR: Run Maven build & test (Java 17)
# 2. If tests pass: Build Docker image
# 3. Verify Docker container starts and responds to health check
# 4. Report results & artifacts
#
# Exit Codes:
#   0 = Success (all checks pass)
#   1 = Failure (any check fails)
#
# Artifacts Saved:
#   - test-results-17/ : JUnit XML test reports
#   - target/surefire-reports/ : Detailed test output
# ─────────────────────────────────────────────────────────────────────────
